{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinanceWise{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}{% endblock %}

</head>
<body>
    <header class="navbar">
        <a class="brand" href="{% url 'home' %}">FinanceWise</a>

        <div class="nav-actions">
            <button class="profile-button" title="Profile">Profile</button>
            <a class="btn btn-outline" href="#">Sign In</a>
            <a class="btn btn-primary" href="#">Sign Up</a>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">&#9776;</button>

<nav>
            <a class="active" href="{% url 'home' %}">
                <span class="nav-icon">&#8962;</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#">
                <span class="nav-icon">$</span>
                <span class="nav-label">Transactions</span>
            </a>
            <a href="#">
                <span class="nav-icon">&#9638;</span>
                <span class="nav-label">Budget</span>
            </a>
            <a href="#">
                <span class="nav-icon">&#8599;</span>
                <span class="nav-label">Goals</span>
            </a>
            <a href="#">
                <span class="nav-icon">&#9733;</span>
                <span class="nav-label">Learning</span>
            </a>
            <a href="#">
                <span class="nav-icon">&#9881;</span>
                <span class="nav-label">Settings</span>
            </a>
        </nav>
    </aside>

    <main class="main-content" id="mainContent">
        {% block content %}
        {% endblock %}
    </main>

    <script src="{% static 'JS/sidebar.js' %}"></script>
</body>
</html>
