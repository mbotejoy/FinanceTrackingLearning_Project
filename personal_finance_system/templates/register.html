{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | FinanceWise</title>

    <link rel="stylesheet"
          href="{% static 'css/auth.css' %}">

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<header class="auth-navbar">

    <div class="auth-nav-container">

        <a href="{% url 'landing' %}"
           class="auth-logo">

            Finance<span>Wise</span>

        </a>


        <a href="{% url 'landing' %}"
           class="auth-home-link">

            Back to Home

        </a>

    </div>

</header>



<!-- =========================================
     REGISTRATION
========================================= -->

<main class="auth-page">

    <section class="auth-card">


        <div class="auth-heading">

            <h1>Create Your Account</h1>

            <p>
                Join FinanceWise and start building
                stronger financial habits.
            </p>

        </div>



        <form method="POST"
              class="auth-form">

            {% csrf_token %}



            <!-- First + Last Name -->

            <div class="auth-form-row">


                <div class="form-group">

                    <label for="first_name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        placeholder="First name"
                        required>

                </div>



                <div class="form-group">

                    <label for="last_name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        placeholder="Last name"
                        required>

                </div>


            </div>



            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>

            </div>



            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required>

                <span class="auth-help">
                    Use a strong password that you can remember.
                </span>

            </div>



            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    required>

            </div>



            <!-- Submit -->

            <button
                type="submit"
                class="auth-submit">

                Create Account

            </button>


        </form>



        <!-- Login -->

        <p class="auth-switch">

            Already have an account?

            <a href="{% url 'login' %}">
                Sign In
            </a>

        </p>


    </section>

</main>


</body>

</html>
